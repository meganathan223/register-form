<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- style sheet -->
    <link rel="stylesheet" href="style.css">
    <!-- google fontstyle -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <div class="container__form">
            <div class="form__header">
                <h2 class="heading signin">Sign In</h2>
                <h2 class="heading register border">Register</h2>
            </div>
            <div class="notification" style="display: none;">
                <p>
                    Registered Successfully
                    <i class="fa-solid fa-circle-check" style="color: green;font-size: 20px;"></i>
                </p>
            </div>
            <div class="sections">
                <!-- Sign In Form -->
                <form action="index.html" id="signin" style="display: none;">
                    <div class="form__section">
                        <label for="email">Email:</label>
                        <input type="text" id="email" placeholder="example@email.com">
                        <p class="err-msg"></p>
                    </div>
                    <div class="form__section">
                        <label for="password">Password:</label>
                        <input type="password" id="password" min="6">
                        <p class="err-msg"></p>
                    </div>

                    <p style="color: gray; font-size: 12px;">Forgot Password?</p>

                    <button id="signin-btn" disabled>Sign In</button>

                    <p style="text-align: right;color: gray; font-size: 12px;">Don't have an account? <span
                            class="to-register" style="color: blue;border-bottom: solid blue 1px;cursor:pointer;">Create
                            Now</span>
                    </p>
                </form>

                <!-- Register Form -->
                <form action="index.html" id="register">
                    <div class="form__section">
                        <label for="name">Name:</label>
                        <input type="text" id="name" placeholder="Enter your name">
                        <p class="err-msg"></p>
                    </div>
                    <div class="form__section">
                        <label for="email">Email:</label>
                        <input type="text" id="email" placeholder="example@email.com">
                        <p class="err-msg"></p>
                    </div>
                    <div class="form__section">
                        <label for="password">Password:</label>
                        <input type="password" id="password" min="6">
                        <p class="err-msg"></p>
                    </div>
                    <div class="form__section textarea">
                        <label for="bio">Bio:</label>
                        <textarea type="textarea" id="bio" placeholder="type your message" maxlength="200"></textarea>
                        <p class="counter"><span class="charcount">0</span>/200</p>
                    </div>

                    <button id="submit-btn" disabled>Submit</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
